services:
  postgres:
    image: postgres:15-alpine
    container_name: task-postgres
    environment:
      POSTGRES_DB: tasksdb                    
      POSTGRES_USER: user                    
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tasksdb"]  
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - task-network

  redis:
    image: redis:7-alpine
    container_name: task-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - task-network

  app:
    build: .
    container_name: task-app
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/tasksdb
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - task-network

volumes:
  postgres_data:

networks:
  task-network:
    driver: bridge